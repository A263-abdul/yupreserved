<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="YupReserved — find and book a stay anywhere in India. Heritage palaces, beach shacks, houseboats and hill cottages." />
    <meta name="theme-color" content="#F6EFE4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12141F" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="YupReserved" />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <title>YupReserved — stays across India</title>
    <script>
      // apply the saved theme before first paint (no flash)
      try {
        var t = localStorage.getItem("yup-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
